name: Windows desktop build

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run regression tests before building
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6.1.0
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-rust-
      - name: Test and build portable Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual C++ tools not found' }
          $devCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $testCommands = if ('${{ inputs.run_tests }}' -eq 'true') { "cargo test --locked --target x86_64-pc-windows-msvc`nif errorlevel 1 exit /b 1" } else { 'rem Tests already passed for this source revision' }
          @"
          @echo off
          call "$devCmd" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          $testCommands
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if errorlevel 1 exit /b 1
          cargo build --locked --release --example render_previews --target x86_64-pc-windows-msvc
          exit /b %errorlevel%
          "@ | Set-Content ci-build.cmd -Encoding ascii
          & cmd.exe /d /c ci-build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests/build failed' }
          $redistRoot = Join-Path $installation 'VC\Redist\MSVC'
          $crt = Get-ChildItem $redistRoot -Directory -Recurse -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue | Where-Object { $_.Parent.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          $runtime = if ($crt) { $crt.FullName } else { Join-Path $env:SystemRoot 'System32' }
          if (-not (Test-Path (Join-Path $runtime 'msvcp140.dll'))) { throw 'Visual C++ runtime not found' }
          ./scripts/package-windows.ps1 -Version '0.5.0' -RuntimeDirectory $runtime
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: notes-ai-windows-0.5.0
          path: |
            dist/NotesAI-0.5.0-windows-x64.zip
            target/x86_64-pc-windows-msvc/release/notes_ai.exe
            target/x86_64-pc-windows-msvc/release/examples/render_previews.exe
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/cache/save@v6.1.0
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-v2-${{ hashFiles('Cargo.lock') }}
