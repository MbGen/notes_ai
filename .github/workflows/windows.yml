name: Windows desktop build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-rust-
      - name: Test and build portable Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual C++ tools not found' }
          $devCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          @"
          @echo off
          call "$devCmd" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cargo test --locked --target x86_64-pc-windows-msvc
          if errorlevel 1 exit /b 1
          cargo build --locked --release --target x86_64-pc-windows-msvc
          exit /b %errorlevel%
          "@ | Set-Content ci-build.cmd -Encoding ascii
          & cmd.exe /d /c ci-build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests/build failed' }
          $redist = Get-ChildItem (Join-Path $installation 'VC\Redist\MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $crt = Get-ChildItem (Join-Path $redist.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw 'Visual C++ runtime not found' }
          ./scripts/package-windows.ps1 -Version '0.4.1' -RuntimeDirectory $crt.FullName
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: notes-ai-windows-0.4.1
          path: dist/NotesAI-0.4.1-windows-x64.zip
          retention-days: 7
