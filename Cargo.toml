[package]
name = "notes_ai"
version = "0.5.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# Keep the original Skia backend for Windows font rendering.
slint = { version = "1.14.1", features = ["renderer-winit-skia", "unstable-winit-030"] }
ollama-rs = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version="1.50.0", features=["full"] }
chrono = "0.4.44"
axum = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
uuid = { version = "1", features = ["v4"] }
sqlite-vec = "0.1.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
scraper = "0.24"
open = "5"
rfd = "0.15"
tempfile = "3"
sha2 = "0.10"


[build-dependencies]
slint-build = "1.14.1"

[profile.release]
codegen-units = 1
lto = true
